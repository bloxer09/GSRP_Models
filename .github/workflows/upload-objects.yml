name: Upload object models
on:
  push:
    branches: [main]
    paths:
      - 'custom_objects/**'
      - 'tools/object_sync.py'
      - '.github/workflows/upload-objects.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Shares the model import's group so only one job talks to the panel at a time
  group: model-import-${{ github.repository }}
  cancel-in-progress: false
jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out object models
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Test upload client
        run: python3 -m unittest tests.test_object_sync tests.test_model_sync_ptero -v
      - name: Upload to the server's models folder
        env:
          PTERO_ALLOW_INSECURE_HTTP: ${{ vars.PTERO_ALLOW_INSECURE_HTTP }}
          PTERO_PANEL_URL: ${{ vars.PTERO_PANEL_URL }}
          PTERO_SERVER_ID: ${{ vars.PTERO_SERVER_ID }}
          PTERO_CLIENT_API_KEY: ${{ secrets.PTERO_CLIENT_API_KEY }}
        run: python3 tools/object_sync.py --root .
