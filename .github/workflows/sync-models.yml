name: Import pending models
on:
  push:
    branches: [main]
    paths:
      - 'pending_skins/**'
      - 'pending_graffiti/**'
      - 'pending_public_skins/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: model-import-${{ github.repository }}
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out current pending queue
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Test sync client
        run: GITHUB_STEP_SUMMARY=/dev/null python3 -m unittest discover -s tests -v
      - name: Transfer and archive confirmed imports
        env:
          PTERO_ALLOW_INSECURE_HTTP: ${{ vars.PTERO_ALLOW_INSECURE_HTTP }}
          PTERO_PANEL_URL: ${{ vars.PTERO_PANEL_URL }}
          PTERO_SERVER_ID: ${{ vars.PTERO_SERVER_ID }}
          PTERO_CLIENT_API_KEY: ${{ secrets.PTERO_CLIENT_API_KEY }}
        run: python3 tools/model_sync.py sync --root .
